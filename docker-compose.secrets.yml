# Secretos gestionados con **Docker secrets** en lugar de variables en claro.
#
# Los secretos se montan como ficheros en /run/secrets/... y la app los lee por
# las variantes PASSWD_*_FILE (soportadas en app/config.py). Así no aparecen en
# `docker inspect` ni en la tabla de procesos. Prepara los ficheros de secreto
# (fuera del repo, con permisos 0600) y arranca combinando este overlay:
#
#   docker compose -f docker-compose.yml -f docker-compose.frontend.yml \
#                  -f docker-compose.secrets.yml up -d
#
# En este ejemplo los secretos vienen de ficheros locales; en Swarm usa
# `docker secret create`. Genera las claves como en .env.produccion.example.

services:
  app:
    environment:
      PASSWD_SECRET_KEY_FILE: /run/secrets/passwd_secret_key
      PASSWD_ENCRYPTION_KEY_FILE: /run/secrets/passwd_encryption_key
      PASSWD_SMTP_PASSWORD_FILE: /run/secrets/passwd_smtp_password
      PASSWD_REQUIRE_ENV_KEYS: "true"
    secrets:
      - passwd_secret_key
      - passwd_encryption_key
      - passwd_smtp_password

secrets:
  passwd_secret_key:
    file: ./secrets/passwd_secret_key
  passwd_encryption_key:
    file: ./secrets/passwd_encryption_key
  passwd_smtp_password:
    file: ./secrets/passwd_smtp_password
