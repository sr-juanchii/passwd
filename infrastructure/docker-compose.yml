version: "3.9"

services:
  mysql:
    image: mysql:8.0.36
    container_name: zkm-mysql
    command: >
      --require-secure-transport=ON
      --default-authentication-plugin=caching_sha2_password
      --ssl-ca=/etc/mysql/ssl/ca.pem
      --ssl-cert=/etc/mysql/ssl/server-cert.pem
      --ssl-key=/etc/mysql/ssl/server-key.pem
      --general-log=0
      --slow-query-log=1
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_INITDB_SKIP_TZINFO: "1"
    volumes:
      - ./mysql/bootstrap.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./mysql/ssl:/etc/mysql/ssl:ro
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    secrets:
      - db_root_password
      - db_app_password
      - kc_db_password
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=socket -uroot -p$$(cat /run/secrets/db_root_password) --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: zkm-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak_db?useSSL=true&requireSSL=true
      KC_DB_USERNAME: keycloak_svc
      KC_DB_PASSWORD_FILE: /run/secrets/kc_db_password
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - mysql
    secrets:
      - kc_db_password
    networks:
      - backend-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: zkm-backend
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: inventory_zk
      DATABASE_USER: app_service
      DATABASE_PASSWORD_FILE: /run/secrets/db_app_password
      DATABASE_SSL_CA: /etc/mysql/ssl/ca.pem
      OIDC_ISSUER_URL: http://keycloak:8080/realms/inventory
      OIDC_AUDIENCE: inventory-api
      LOG_LEVEL: INFO
      CORS_ALLOWED_ORIGINS: '["http://localhost:4200"]'
    volumes:
      - ./mysql/ssl:/etc/mysql/ssl:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - mysql
      - keycloak
    secrets:
      - db_app_password
    networks:
      - backend-net
      - frontend-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: zkm-frontend
    ports:
      - "127.0.0.1:4200:80"
    networks:
      - frontend-net

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_app_password:
    file: ./secrets/db_app_password.txt
  kc_db_password:
    file: ./secrets/kc_db_password.txt

volumes:
  mysql_data:

networks:
  backend-net:
    internal: true
  frontend-net:
