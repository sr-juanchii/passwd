{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if vm else 'Nueva' }} máquina virtual — {{ app_name }}{% endblock %}
{% block contenido %}
<p><a class="enlace-suave" href="{{ '/vms/' ~ vm.id if vm else '/hipervisores/' ~ hipervisor.id }}">← Volver</a></p>
<div class="tarjeta tarjeta-formulario">
  <h1>{{ 'Editar máquina virtual' if vm else 'Nueva máquina virtual en ' ~ hipervisor.nombre }}</h1>
  <form method="post"
        action="{{ '/vms/' ~ vm.id ~ '/editar' if vm else '/hipervisores/' ~ hipervisor.id ~ '/vms/nueva' }}"
        class="formulario">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <label for="nombre">Nombre *</label>
    <input id="nombre" name="nombre" type="text" required maxlength="120"
           value="{{ vm.nombre if vm else '' }}" placeholder="Ej.: vm-correo">

    <label for="sistema_operativo">Sistema operativo</label>
    <input id="sistema_operativo" name="sistema_operativo" type="text" maxlength="120"
           value="{{ vm.sistema_operativo if vm else '' }}" placeholder="Ej.: Ubuntu Server 24.04">

    <label for="ip">Dirección IP</label>
    <input id="ip" name="ip" type="text" maxlength="45"
           value="{{ vm.ip if vm else '' }}" placeholder="Ej.: 192.168.20.15">

    <label for="descripcion">Sistema / función que cumple</label>
    <textarea id="descripcion" name="descripcion" rows="3" maxlength="2000"
      placeholder="Ej.: Servidor de correo institucional (Postfix + Dovecot)">{{ vm.descripcion if vm else '' }}</textarea>

    <label for="ram">RAM asignada</label>
    <input id="ram" name="ram" type="text" maxlength="60"
           value="{{ vm.ram if vm else '' }}" placeholder="Ej.: 8 GB">

    <label for="cpu">CPU asignada (núcleos/vCPU)</label>
    <input id="cpu" name="cpu" type="text" maxlength="120"
           value="{{ vm.cpu if vm else '' }}" placeholder="Ej.: 4 vCPU">

    <label for="almacenamiento">Almacenamiento asignado</label>
    <input id="almacenamiento" name="almacenamiento" type="text" maxlength="120"
           value="{{ vm.almacenamiento if vm else '' }}" placeholder="Ej.: 120 GB SSD">

    <label for="estado">Estado</label>
    <select id="estado" name="estado">
      {% for e in estados %}
      <option value="{{ e }}" {{ 'selected' if vm and vm.estado == e }}>{{ etiquetas_estado[e] }}</option>
      {% endfor %}
    </select>

    <label for="etiquetas">Etiquetas (separadas por coma)</label>
    <input id="etiquetas" name="etiquetas" type="text" maxlength="255"
           value="{{ vm.etiquetas if vm else '' }}" placeholder="Ej.: producción, correo">

    <button type="submit" class="boton boton-primario">{{ 'Guardar cambios' if vm else 'Registrar máquina virtual' }}</button>
  </form>
</div>
{% endblock %}
