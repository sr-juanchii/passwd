{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if hipervisor else 'Nuevo' }} hipervisor — {{ app_name }}{% endblock %}
{% block contenido %}
<p><a class="enlace-suave" href="{{ '/hipervisores/' ~ hipervisor.id if hipervisor else '/' }}">← Volver</a></p>
<div class="tarjeta tarjeta-formulario">
  <h1>{{ 'Editar hipervisor' if hipervisor else 'Nuevo hipervisor' }}</h1>
  <form method="post"
        action="{{ '/hipervisores/' ~ hipervisor.id ~ '/editar' if hipervisor else '/hipervisores/nuevo' }}"
        class="formulario">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <label for="nombre">Nombre *</label>
    <input id="nombre" name="nombre" type="text" required maxlength="120"
           value="{{ hipervisor.nombre if hipervisor else '' }}" placeholder="Ej.: pve-nodo-01">

    <label for="plataforma">Plataforma *</label>
    <input id="plataforma" name="plataforma" type="text" required maxlength="60" list="plataformas"
           value="{{ hipervisor.plataforma if hipervisor else '' }}" placeholder="Ej.: Proxmox VE">
    <datalist id="plataformas">
      <option value="Proxmox VE"><option value="VMware ESXi"><option value="Microsoft Hyper-V">
      <option value="KVM / libvirt"><option value="XCP-ng"><option value="Citrix XenServer">
    </datalist>

    <label for="version">Versión</label>
    <input id="version" name="version" type="text" maxlength="60"
           value="{{ hipervisor.version if hipervisor else '' }}" placeholder="Ej.: 8.2">

    <label for="ip_gestion">IP / URL de gestión</label>
    <input id="ip_gestion" name="ip_gestion" type="text" maxlength="45"
           value="{{ hipervisor.ip_gestion if hipervisor else '' }}" placeholder="Ej.: 192.168.10.6">

    <label for="marca_modelo">Marca / Modelo</label>
    <input id="marca_modelo" name="marca_modelo" type="text" maxlength="120"
           value="{{ hipervisor.marca_modelo if hipervisor else '' }}" placeholder="Ej.: Dell PowerEdge R750">

    <label for="ubicacion">Ubicación</label>
    <input id="ubicacion" name="ubicacion" type="text" maxlength="120"
           value="{{ hipervisor.ubicacion if hipervisor else '' }}" placeholder="Ej.: CPD principal, rack 3">

    <label for="ram">RAM</label>
    <input id="ram" name="ram" type="text" maxlength="60"
           value="{{ hipervisor.ram if hipervisor else '' }}" placeholder="Ej.: 256 GB">

    <label for="cpu">CPU</label>
    <input id="cpu" name="cpu" type="text" maxlength="120"
           value="{{ hipervisor.cpu if hipervisor else '' }}" placeholder="Ej.: 2x Intel Xeon Gold">

    <label for="almacenamiento">Almacenamiento</label>
    <input id="almacenamiento" name="almacenamiento" type="text" maxlength="120"
           value="{{ hipervisor.almacenamiento if hipervisor else '' }}" placeholder="Ej.: 4x 1.92 TB SSD">

    <label for="numero_serie">Número de serie</label>
    <input id="numero_serie" name="numero_serie" type="text" maxlength="120"
           value="{{ hipervisor.numero_serie if hipervisor else '' }}">

    <label for="garantia_hasta">Garantía hasta</label>
    <input id="garantia_hasta" name="garantia_hasta" type="text" maxlength="40"
           value="{{ hipervisor.garantia_hasta if hipervisor else '' }}" placeholder="AAAA-MM-DD">

    <label for="proveedor">Proveedor</label>
    <input id="proveedor" name="proveedor" type="text" maxlength="120"
           value="{{ hipervisor.proveedor if hipervisor else '' }}">

    <label for="descripcion">Descripción</label>
    <textarea id="descripcion" name="descripcion" rows="3" maxlength="2000"
      placeholder="Ej.: Nodo principal del clúster de virtualización">{{ hipervisor.descripcion if hipervisor else '' }}</textarea>

    <label for="estado">Estado</label>
    <select id="estado" name="estado">
      {% for e in estados %}
      <option value="{{ e }}" {{ 'selected' if hipervisor and hipervisor.estado == e }}>{{ etiquetas_estado[e] }}</option>
      {% endfor %}
    </select>

    <label for="etiquetas">Etiquetas (separadas por coma)</label>
    <input id="etiquetas" name="etiquetas" type="text" maxlength="255"
           value="{{ hipervisor.etiquetas if hipervisor else '' }}" placeholder="Ej.: clúster-a, producción">

    {% if puede('inventario.restringir') %}
    <label class="casilla">
      <input type="checkbox" name="restringido" value="1" {{ 'checked' if hipervisor and hipervisor.restringido }}>
      Restringir a administradores (los operadores no verán este hipervisor ni sus VMs)
    </label>
    {% endif %}

    <button type="submit" class="boton boton-primario">{{ 'Guardar cambios' if hipervisor else 'Registrar hipervisor' }}</button>
  </form>
</div>
{% endblock %}
