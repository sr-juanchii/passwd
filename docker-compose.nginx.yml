# Terminación HTTPS con nginx delante de la aplicación.
#
# Uso (la app deja de publicarse en el host; solo se llega por nginx vía 443):
#   1. Definir PASSWD_DOMAIN en .env (p. ej. passwd.su-organizacion.tld)
#   2. Colocar los certificados en infrastructure/nginx/certs/ como
#      fullchain.pem y privkey.pem (para PRUEBAS: ./infrastructure/nginx/generar-cert-autofirmado.sh)
#   3. docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d --build
#
# Guía completa y rotación de certificados: docs/guia-nginx-tls.md

services:
  app:
    # Detrás de nginx confiamos en las cabeceras de reenvío para registrar la
    # IP real del cliente en la auditoría. Es seguro porque (a) nginx
    # SOBRESCRIBE X-Forwarded-For con la IP que observa y (b) el puerto de la
    # app deja de publicarse en el host (ports: !reset []), de modo que solo
    # nginx puede alcanzarla dentro de la red interna.
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0",
              "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports: !reset []
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Solo se sustituyen variables PASSWD_* en la plantilla; las de nginx no.
      PASSWD_DOMAIN: ${PASSWD_DOMAIN:-localhost}
      NGINX_ENVSUBST_FILTER: "^PASSWD_"
    volumes:
      - ./infrastructure/nginx/templates:/etc/nginx/templates:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - red-passwd
    # Recarga periódica para adoptar certificados renovados por certbot sin
    # reiniciar (el hook copia los .pem; nginx los toma en el siguiente reload).
    command:
      - /bin/sh
      - -c
      - |
        (while :; do sleep 6h; nginx -s reload 2>/dev/null || true; done) &
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    healthcheck:
      # nginx responde (aunque sea 404 en la raíz del webroot): wget devuelve 8
      # ante una respuesta HTTP de error, lo que igualmente prueba que está vivo.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/.well-known/acme-challenge/ >/dev/null 2>&1 || [ $? -eq 8 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 128

volumes:
  certbot-webroot:
