# Configuración de Alembic (migraciones de esquema versionadas).
#
# La URL de conexión NO se define aquí: migrations/env.py la toma de la
# configuración de la aplicación (PASSWD_DATABASE_URL / PASSWD_DATA_DIR), de
# modo que las migraciones operan siempre sobre la misma base que la app.
#
# Uso habitual (ver docs/guia-desarrollo.md §7):
#   alembic upgrade head                  # aplicar migraciones pendientes
#   alembic stamp head                    # marcar una BD existente como al día
#   alembic revision --autogenerate -m "descripcion"   # nueva migración

[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
