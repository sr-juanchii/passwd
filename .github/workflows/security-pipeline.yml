name: Security Quality Gate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Mypy Strict Type Check
        run: mypy app/ --strict --no-error-summary

      - name: Ruff Linter
        run: ruff check app/ --fix --exit-non-zero-on-fix

      - name: Bandit SAST Scanner
        run: bandit -r app/ -f json -o bandit-report.json -ll

      - name: Safety SCA
        run: safety check --full-report --output json > safety-report.json

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            backend/bandit-report.json
            backend/safety-report.json

  unit-tests:
    runs-on: ubuntu-latest
    needs: static-analysis
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Tests
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-fail-under=80

  container-build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t zkm-backend:${{ github.sha }} ./backend

      - name: Build Frontend Image
        run: docker build -t zkm-frontend:${{ github.sha }} ./frontend

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "zkm-backend:${{ github.sha }}"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

  dast-scan:
    runs-on: ubuntu-latest
    needs: container-build
    if: github.ref == 'refs/heads/main'
    env:
      DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD || 'dev-root-password' }}
      DB_APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD || 'dev-app-password' }}
      KC_DB_PASSWORD: ${{ secrets.KC_DB_PASSWORD || 'dev-keycloak-password' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare secret files
        working-directory: ./infrastructure
        run: |
          mkdir -p secrets
          printf '%s' "$DB_ROOT_PASSWORD" > secrets/db_root_password.txt
          printf '%s' "$DB_APP_PASSWORD" > secrets/db_app_password.txt
          printf '%s' "$KC_DB_PASSWORD" > secrets/kc_db_password.txt

      - name: Start Services
        working-directory: ./infrastructure
        run: docker compose up -d --wait --wait-timeout 180

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8000"
          cmd_options: "-a -j"

      - name: Teardown
        if: always()
        working-directory: ./infrastructure
        run: docker compose down -v
