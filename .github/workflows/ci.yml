name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  calidad-y-pruebas:
    name: Lint, análisis de seguridad y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Análisis estático de seguridad (bandit)
        run: bandit -r app --severity-level medium -q

      - name: Pruebas (pytest)
        run: pytest
