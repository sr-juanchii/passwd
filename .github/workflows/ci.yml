name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  calidad-y-pruebas:
    name: Lint, análisis de seguridad y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests migrations

      - name: Análisis estático de seguridad (bandit)
        run: bandit -r app --severity-level medium -q

      - name: Vulnerabilidades en dependencias (pip-audit, OWASP A06)
        run: pip-audit -r requirements.txt

      - name: Pruebas (pytest + cobertura)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  pruebas-mysql:
    name: Smoke de la API sobre MySQL (READ COMMITTED)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: passwd
          MYSQL_USER: passwd
          MYSQL_PASSWORD: passwd
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verificación funcional end-to-end contra MySQL
        env:
          PASSWD_DATABASE_URL: mysql+pymysql://passwd:passwd@127.0.0.1:3306/passwd
        run: python scripts/verificar_api_web.py

  frontend:
    name: Frontend (lint, tipos, build, pruebas y auditoría)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar pnpm (versión de packageManager)
        uses: pnpm/action-setup@v4
        with:
          # Los pasos `uses:` ignoran defaults.run.working-directory, así que hay
          # que apuntar al package.json del frontend para leer «packageManager».
          package_json_file: frontend/package.json

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Tipos (tsc --noEmit)
        run: pnpm typecheck

      - name: Pruebas (vitest)
        run: pnpm test

      - name: Compilación (next build)
        run: pnpm build

      - name: Exposición de código fuente en los artefactos públicos
        # Verifica que .next/static y public/ no publiquen mapas de origen
        # (*.map, que reconstruyen el TypeScript original), secretos de servidor
        # ni rutas absolutas del entorno de compilación.
        run: bash ../scripts/verificar-build-frontend.sh .

      - name: Vulnerabilidades en dependencias (pnpm audit, OWASP A06)
        # npm retiró el endpoint clásico de auditoría (HTTP 410) y esta versión
        # de pnpm aún lo consulta. Si el registro no responde, se avisa y no se
        # bloquea; las vulnerabilidades críticas REALES siguen rompiendo el job.
        run: |
          salida=$(pnpm audit --prod --audit-level critical 2>&1) && estado=0 || estado=$?
          echo "$salida"
          if [ "$estado" -ne 0 ] && echo "$salida" | grep -q "ERR_PNPM_AUDIT_BAD_RESPONSE"; then
            echo "::warning::Endpoint de auditoría de npm no disponible (410); auditoría omitida sin bloquear."
            exit 0
          fi
          exit "$estado"

  navegador:
    name: Pruebas de navegador (Playwright) contra backend + frontend + SMTP
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configurar pnpm (versión de packageManager)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias de Python (incluye el receptor SMTP)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Instalar dependencias del frontend (lockfile congelado)
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Instalar Chromium y sus bibliotecas
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      # playwright.config.ts levanta los tres servicios: el receptor SMTP, el
      # backend FastAPI y el frontend compilado para producción. No hay base de
      # datos externa: cada tanda estrena la suya en .e2e/.
      - name: Pruebas de navegador
        run: pnpm test:e2e
        working-directory: frontend

      - name: Guardar el informe del fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-informe
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  agente:
    name: Agente Go (formato, vet, pruebas, vulnerabilidades y compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agente
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      # La versión sale de agente/go.mod: una sola fuente de verdad, la misma
      # que usa quien compila en local.
      - name: Configurar Go (versión de agente/go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: agente/go.mod
          cache-dependency-path: agente/go.sum

      # El helper root verifica contraseñas con PAM (cgo): necesita sus cabeceras.
      # El agente, en cambio, se compila sin cgo y no depende de nada del sistema.
      - name: Cabeceras de PAM para el helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpam0g-dev

      - name: Formato (gofmt)
        run: |
          sin_formato=$(gofmt -l .)
          if [ -n "$sin_formato" ]; then echo "Sin gofmt:"; echo "$sin_formato"; exit 1; fi

      - name: Análisis estático (go vet)
        run: go vet ./... && go vet -tags integracion ./...

      # Incluye la interoperabilidad con el backend: internal/sobre abre el
      # mismo vector (tests/vectores/cifrado_agente.json) que abre Python.
      - name: Pruebas (con detector de carreras)
        run: go test -race ./...

      # Integración REAL en el runner, que es una máquina desechable: cuentas
      # Linux creadas con useradd, PAM y chpasswd de verdad, y el helper servido
      # por conexión como lo hará systemd. Con PASSWD_INTEGRACION=1, la falta de
      # un requisito es un fallo: no puede pasar en verde sin ejecutarse.
      - name: Integración con cuentas reales (root, PAM y chpasswd)
        run: |
          go build -o "$RUNNER_TEMP/passwd-agente-helper" ./cmd/passwd-agente-helper
          sudo PASSWD_INTEGRACION=1 PASSWD_HELPER_BIN="$RUNNER_TEMP/passwd-agente-helper" \
            "$(command -v go)" test -count=1 -tags integracion -run Integracion -v ./internal/ejecutor/

      - name: Vulnerabilidades en dependencias y biblioteca estándar (govulncheck, OWASP A06)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      # El agente: binario estático (sin cgo) para las dos arquitecturas. El
      # helper enlaza libpam (cgo); se compila para la arquitectura del runner.
      # Los dos llevan la versión del backend: agente y servidor declaran la misma.
      - name: Compilación (agente linux/amd64 y linux/arm64; helper linux/amd64)
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' ../app/__init__.py)
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$version" \
              -o "bin/passwd-agente-linux-$arch" ./cmd/passwd-agente
          done
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X main.version=$version" \
            -o bin/passwd-agente-helper-linux-amd64 ./cmd/passwd-agente-helper
          ./bin/passwd-agente-linux-amd64 version
          ./bin/passwd-agente-helper-linux-amd64 --version

  agente-sistema:
    name: Agente instalado con systemd rotando una cuenta real
    runs-on: ubuntu-latest
    # El runner arranca con systemd: es lo único que prueba que el
    # endurecimiento de las unidades (helper sin red, agente sin privilegios,
    # filtro de llamadas al sistema) deja hacer el trabajo.
    env:
      PASSWD_AGENTES_ENABLED: "true"
      PASSWD_COOKIE_SECURE: "false"
      # Latido cada minuto, para que la prueba no espere los 15 por defecto.
      PASSWD_AGENTES_TELEMETRIA_INTERVALO_MIN: "1"
      CUENTA: pa-e2e
      PASSWORD_INICIAL: Inicial-Sistema-2026!
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      # El contexto «runner» no existe en el env de un job: la ruta se fija aquí.
      - name: Directorio de datos compartido por el backend y la prueba
        run: echo "PASSWD_DATA_DIR=$RUNNER_TEMP/datos" >> "$GITHUB_ENV"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configurar Go (versión de agente/go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: agente/go.mod
          cache-dependency-path: agente/go.sum

      - name: Dependencias
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq libpam0g-dev

      - name: Compilar los binarios y publicar sus sumas
        working-directory: agente
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          # Con la versión del backend, como se publicarán: la prueba exige que
          # el agente instalado la declare.
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' ../app/__init__.py)
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$version" \
            -o "$RUNNER_TEMP/dist/passwd-agente" ./cmd/passwd-agente
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X main.version=$version" \
            -o "$RUNNER_TEMP/dist/passwd-agente-helper" ./cmd/passwd-agente-helper
          (cd "$RUNNER_TEMP/dist" && sha256sum passwd-agente passwd-agente-helper > SHA256SUMS)

      - name: Cuenta Linux real que el agente rotará
        run: |
          sudo useradd -M -N -s /usr/sbin/nologin "$CUENTA"
          echo "$CUENTA:$PASSWORD_INICIAL" | sudo chpasswd

      - name: Backend con los agentes activados
        run: |
          nohup python -m uvicorn --factory app.main:create_app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done

      - name: Preparar el inventario y el alta del agente
        run: |
          python scripts/prueba_agente_sistema.py preparar --cuenta "$CUENTA" \
            --password "$PASSWORD_INICIAL" --token-archivo "$RUNNER_TEMP/token"

      - name: Instalar con instalar.sh (systemd, unidades endurecidas)
        run: |
          sudo agente/instalacion/instalar.sh --backend http://127.0.0.1:8000 --cuentas "$CUENTA" \
            --binarios "$RUNNER_TEMP/dist" --sumas "$RUNNER_TEMP/dist/SHA256SUMS" \
            --token - < "$RUNNER_TEMP/token"
          systemd-analyze security passwd-agente.service | tail -1

      - name: Rotación autorizada, ejecutada por el agente instalado
        run: python scripts/prueba_agente_sistema.py rotar --cuenta "$CUENTA"

      - name: Registros si algo falló
        if: failure()
        run: |
          sudo journalctl -u passwd-agente.service -u 'passwd-agente-helper@*' --no-pager | tail -100
          tail -50 "$RUNNER_TEMP/backend.log"

  cadena-de-suministro:
    name: Escaneo de secretos e imagen (OWASP A05/A06/A08)
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Recomendado: fijar estas actions por SHA en un endurecimiento posterior.
      - name: Escaneo de secretos filtrados (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Escaneo de vulnerabilidades y config (Trivy, sistema de archivos)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "1"
