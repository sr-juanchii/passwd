name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  calidad-y-pruebas:
    name: Lint, análisis de seguridad y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests migrations

      - name: Análisis estático de seguridad (bandit)
        run: bandit -r app --severity-level medium -q

      - name: Vulnerabilidades en dependencias (pip-audit, OWASP A06)
        run: pip-audit -r requirements.txt

      - name: Pruebas (pytest + cobertura)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  pruebas-mysql:
    name: Smoke de la API sobre MySQL (READ COMMITTED)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: passwd
          MYSQL_USER: passwd
          MYSQL_PASSWORD: passwd
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verificación funcional end-to-end contra MySQL
        env:
          PASSWD_DATABASE_URL: mysql+pymysql://passwd:passwd@127.0.0.1:3306/passwd
        run: python scripts/verificar_api_web.py

  frontend:
    name: Frontend (lint, tipos, build, pruebas y auditoría)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar pnpm (versión de packageManager)
        uses: pnpm/action-setup@v4
        with:
          # Los pasos `uses:` ignoran defaults.run.working-directory, así que hay
          # que apuntar al package.json del frontend para leer «packageManager».
          package_json_file: frontend/package.json

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Tipos (tsc --noEmit)
        run: pnpm typecheck

      - name: Pruebas (vitest)
        run: pnpm test

      - name: Compilación (next build)
        run: pnpm build

      - name: Vulnerabilidades en dependencias (pnpm audit, OWASP A06)
        # npm retiró el endpoint clásico de auditoría (HTTP 410) y esta versión
        # de pnpm aún lo consulta. Si el registro no responde, se avisa y no se
        # bloquea; las vulnerabilidades críticas REALES siguen rompiendo el job.
        run: |
          salida=$(pnpm audit --prod --audit-level critical 2>&1) && estado=0 || estado=$?
          echo "$salida"
          if [ "$estado" -ne 0 ] && echo "$salida" | grep -q "ERR_PNPM_AUDIT_BAD_RESPONSE"; then
            echo "::warning::Endpoint de auditoría de npm no disponible (410); auditoría omitida sin bloquear."
            exit 0
          fi
          exit "$estado"

  cadena-de-suministro:
    name: Escaneo de secretos e imagen (OWASP A05/A06/A08)
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Recomendado: fijar estas actions por SHA en un endurecimiento posterior.
      - name: Escaneo de secretos filtrados (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Escaneo de vulnerabilidades y config (Trivy, sistema de archivos)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "1"
