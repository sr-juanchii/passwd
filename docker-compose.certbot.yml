# Renovación de certificados con Let's Encrypt (solo si el servidor es accesible
# desde Internet en el dominio PASSWD_DOMAIN, puerto 80 abierto). Añádase a los
# anteriores. Detalles y emisión inicial en docs/guia-nginx-tls.md §4.
#
#   docker compose -f docker-compose.yml -f docker-compose.nginx.yml \
#                  -f docker-compose.certbot.yml up -d
#
# El contenedor certbot renueva en bucle (cada 12 h comprueba) y, tras renovar,
# copia los certificados al directorio compartido con nginx con los nombres que
# nginx espera. Recargue nginx tras una renovación (ver guía, hay un cron).

services:
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/certs:/certs            # destino que lee nginx
      - certbot-data:/etc/letsencrypt                  # estado interno de certbot
      - certbot-webroot:/var/www/certbot
    entrypoint: /bin/sh
    command: -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --deploy-hook "sh -c \"cp /etc/letsencrypt/live/${PASSWD_DOMAIN}/fullchain.pem /certs/fullchain.pem && cp /etc/letsencrypt/live/${PASSWD_DOMAIN}/privkey.pem /certs/privkey.pem\""; sleep 12h & wait $${!}; done'

volumes:
  certbot-data:
  certbot-webroot:
